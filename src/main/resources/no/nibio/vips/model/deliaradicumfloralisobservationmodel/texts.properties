 Denmark is not known.</p>\n<h3>References</h3>\n<p>Bligaard, J. (1999). Damage Thresholds for Cabbage Root Fly [Delia radicum (L.)] in Cauliflower. Assessed from Pot Experiments. <em>Acta Agriculturae Scandinavica, Section B - Soil &amp; Plant Science , 49</em>(1), pp. 57-64. doi:10.1080/09064719950135713</p>\n<p>Bligaard, J., Meadow, R. , Nielsen, O., &amp; Percy-Smith, A. (1999). Evaluation of felt traps to estimate egg numbers of cabbage root fly, Delia radicum, and turnip root fly, Delia floralis in commercial crops. <em>Entomologia Experimentalis et Applicata, 90</em>, pp. 141&ndash;148. doi:10.1046/j.1570-7458.1999.00432.x</p>\n<p>Contacts: Annette F. Schj&oslash;ll <a href="mailto:annette.folkedal.schjoll@nibio.no">annette.folkedal.schjoll@nibio.no</a><br /> Tor J. Johansen <a href="mailto:tor.johansen@nibio.no">tor.johansen@nibio.no</a></p>\n<h3>Links for more information (Norwegian only)</h3>\n<p>Information about registration of oviposition by cabbage maggots and turnip flies: <a href="http://www.vips-landbruk.no/media/attachments/information/RegEggKalflue2016.pdf">http://www.vips-landbruk.no/media/attachments/information/RegEggKalflue2016.pdf</a></p>\n<p>Plantevernleksikonet:&nbsp;<a href="https://www.plantevernleksikonet.no/l/oppslag/338/" target="_blank">https://www.plantevernleksikonet.no/l/oppslag/338/</a></p>\n<p>&nbsp;</p>
