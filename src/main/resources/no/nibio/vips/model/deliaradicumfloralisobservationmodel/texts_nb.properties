name=Liten og stor k\u00e5lflue - observasjonsmodell
description=<p>Varslingsmodellen er basert p&aring; ukentlige observasjoner av egglegging hos k&aring;lflue (Bligaard, Meadow, R. , Nielsen, O., &amp; Percy-Smith, A., 1999). Modellen er en ren observasjonsbasert modell og det inng&aring;r ingen v&aelig;rdata eller v&aelig;rprognoser. I modellen skilles det ikke mellom stor k&aring;lflue og liten k&aring;lflue. Observasjonene best&aring;r av innsamling av sand fra basis av 10 planter og utvasking av egg ved oppflyting i vann. Tallene registreres i VIPS og gjennomsnittlig antall egg per plante regnes ut. Observasjonene blir sammenlignet med skadeterskler (Bligaard J. , 1999) og varsel blir beregnet.</p>\n<p>Skadetersklene er relatert til plantens utviklingsstadium og angir hvor mange egg av k&aring;lflue planten kan t&aring;le f&oslash;r det gir redusert vekst og avling. I VIPS presenteres det to varslingsmodeller basert p&aring; skadeterskel; en for nyplantet k&aring;l og en for k&aring;l eldre enn 4 uker. Modellen kan ogs&aring; settes opp som privat varsel for egen &aring;ker og da vil modellen variere mellom de to ulike skadetersklene basert p&aring; k&aring;lvekstens alder (med plantetid som utgangspunkt).</p>\n<p>Varslingsmodellen gjelder kun for hodek&aring;l, blomk&aring;l og brokkoli. Skadeterskelen for k&aring;l, blomk&aring;l og brokkoli de f&oslash;rste 4 ukene etter planting er 14 egg per plante per uke. Etter 4 uker endrer skadeterskelen seg til 40 egg per plante per uke. Skadeterskler er ikke utviklet for andre k&aring;lvekster.</p>\n<p>Modellen er tilrettelagt for VIPS av Dr. Richard Meadow.</p>\n<h3>Tolking av varsel</h3>\n<p>Gr&oslash;nne bokser betyr at skadeterskelen (14 egg/plante for nyplantet k&aring;l, 40 egg/plante for k&aring;l eldre enn 4 uker) ikke er n&aring;dd og at det ikke er behov for &aring; sette i verk bekjempelsestiltak.</p>\n<p>R&oslash;de bokser betyr at skadeterskelen(14 egg/plante for nyplantet k&aring;l, 40 egg/plante for k&aring;l eldre enn 4 uker)&nbsp;er overskredet og at det kan v&aelig;re behov for &aring; sette i verk bekjempelsestiltak. Sjekk egen &aring;ker og vurder igangsetting av bekjempelsestiltak.</p>\n<p>Det produseres ingen gule varselbokser for denne modellen. Varsel g&aring;r direkte fra gr&oslash;nt til r&oslash;dt n&aring;r skadeterskelen overskrides.</p>\n<p>Skadetersklene er relatert til plantens utviklingsstadium og angir hvor mange egg av k&aring;lflue planten kan t&aring;le f&oslash;r det gir redusert vekst og avling. Vurder ut fra alder p&aring; dine planter om du skal f&oslash;lge varslet for nyplantet k&aring;l eller varslet for k&aring;l eldre enn 4 uker.</p>\n<p>Angrepet vil variere fra felt til felt og derfor anbefaler vi observasjoner i egen &aring;ker i tillegg.</p>\n<p>Varslingen skal angi riktig tidspunkt for behandling i forhold til skadeterskler. Hvis antall egg registrert overstiger skadeterskelen anbefales det behandling mot k&aring;lflue, dersom plantene er ubeskyttet. Husk behandlingsfrist! Hvis fr&oslash; (blomk&aring;l eller brokkoli) er beiset mot k&aring;lfluer, er det ikke n&oslash;dvendig med behandling tidlig i sesongen.</p>\n<h3>Varslingssesong &ndash; oppstart og avslutning av varsel</h3>\n<p>Starttidspunkt: Registrering av k&aring;lflueegg og k&aring;lfluevarslingen starter i april/mai avhengig av temperaturforholdene og tidspunkt for planting/s&aring;ing av k&aring;lvekstene i det enkelte distrikt.</p>\n<p>Sluttidspunkt: Registreringene p&aring;g&aring;r fram til vekstsesongens slutt.</p>\n<h3>Utpr&oslash;ving og validering av modellen</h3>\n<h4>Nasjonalt</h4>\n<p>Skadetersklene som er basis for modellen benyttes i praksis i norsk k&aring;ldyrking. Det er ikke foretatt en egen validering av modellen.</p>\n<h4>Internasjonalt</h4>\n<p>Skadetersklene som er basis for modellen er basert p&aring; fors&oslash;k gjennomf&oslash;rt i Danmark og i Norge. Det er usikkert hvorvidt skadetersklene benyttes i Danmark i dag.</p>\n<h3>Referanser</h3>\n<p>Bligaard, J. (1999). Damage Thresholds for Cabbage Root Fly [Delia radicum (L.)] in Cauliflower. Assessed from Pot Experiments. <em>Acta Agriculturae Scandinavica, Section B - Soil &amp; Plant Science , 49</em>(1), pp. 57-64. doi:10.1080/09064719950135713</p>\n<p>Bligaard, J., Meadow, R. , Nielsen, O., &amp; Percy-Smith, A. (1999). Evaluation of felt traps to estimate egg numbers of cabbage root fly, Delia radicum, and turnip root fly, Delia floralis in commercial crops. <em>Entomologia Experimentalis et Applicata, 90</em>, pp. 141&ndash;148. doi:10.1046/j.1570-7458.1999.00432.x</p>\n<p>Kontaktpersoner: <a href="http://www.nibio.no/ansatte/annette_folkedalschjll" target="_blank">Annette F. Schj&oslash;ll</a>&nbsp;og&nbsp;<a href="http://www.nibio.no/ansatte/tor_johansen" target="_blank">Tor J. Johansen</a></p>\n<h3>Lenker til mer informasjon</h3>\n<p>Info om registrering av egglegging hos k&aring;lflue: <a href="http://www.vips-landbruk.no/media/attachments/information/RegEggKalflue2016.pdf">http://www.vips-landbruk.no/media/attachments/information/RegEggKalflue2016.pdf</a></p>\n<p>Plantevernleksikonet: <a href="http://leksikon.bioforsk.no/vieworganism.php?organismId=1_338&amp;cropGroupId=-1&amp;cropId=-1&amp;pestGroupId=3&amp;showMacroOrganisms=false">http://leksikon.bioforsk.no/vieworganism.php?organismId=1_338&amp;cropGroupId=-1&amp;cropId=-1&amp;pestGroupId=3&amp;showMacroOrganisms=false</a></p>
